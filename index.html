<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <title>Prototyp</title>

<script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/addons/p5.sound.min.js"></script>
</head>

<body>
  <h1>Prototyp</h1>

  <script>
   let mikrofon;
let gestartet = false;
let startKnopf;

function setup() {
  createCanvas(600, 400);

  startKnopf = createButton("Mikrofon starten");
  startKnopf.mousePressed(starteMikrofon);
}

async function starteMikrofon() {
  try {
    await userStartAudio();

    mikrofon = new p5.AudioIn();
    await mikrofon.start();

    gestartet = true;
    startKnopf.html("Mikrofon läuft");
    startKnopf.attribute("disabled", "");
  } catch (fehler) {
    console.error(fehler);
    startKnopf.html("Erneut versuchen");
  }
}

function draw() {
  background(20);

  let lautstaerke = 0;

  if (gestartet) {
    lautstaerke = mikrofon.getLevel();
  }

  let groesse = 100 + lautstaerke * 1500;

  fill(0, 150, 255);
  circle(300, 200, groesse);
}
  </script>
</body>

</html>
